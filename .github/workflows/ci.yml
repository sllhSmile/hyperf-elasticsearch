name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php }} / Hyperf ${{ matrix.hyperf }} / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', hyperf: '~3.0.0', sdk: '^8.0' }
          - { php: '8.1', hyperf: '~3.0.0', sdk: '^9.0' }
          - { php: '8.1', hyperf: '~3.1.0', sdk: '^8.0' }
          - { php: '8.1', hyperf: '~3.1.0', sdk: '^9.0' }
          - { php: '8.2', hyperf: '~3.2.0', sdk: '^8.0' }
          - { php: '8.3', hyperf: '~3.2.0', sdk: '^8.0' }
          - { php: '8.4', hyperf: '~3.2.0', sdk: '^9.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole
          coverage: none
          tools: composer:v2
      - run: composer require --no-update "hyperf/context:${{ matrix.hyperf }}" "hyperf/config:${{ matrix.hyperf }}" "hyperf/guzzle:${{ matrix.hyperf }}" "elasticsearch/elasticsearch:${{ matrix.sdk }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --no-check-publish --no-interaction
      - run: find src tests benchmarks -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer analyse
      - run: composer cs-check

  integration:
    name: Elasticsearch ${{ matrix.elasticsearch }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elasticsearch: '8.19.4', php: '8.1', hyperf: '~3.1.0', sdk: '^8.0' }
          - { elasticsearch: '9.1.4', php: '8.4', hyperf: '~3.2.0', sdk: '^9.0' }
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole
          coverage: none
          tools: composer:v2
      - run: composer require --no-update "hyperf/context:${{ matrix.hyperf }}" "hyperf/config:${{ matrix.hyperf }}" "hyperf/guzzle:${{ matrix.hyperf }}" "elasticsearch/elasticsearch:${{ matrix.sdk }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite Elasticsearch --filter ElasticsearchIntegrationTest
        env:
          ELASTICSEARCH_TEST_HOST: http://127.0.0.1:9200
